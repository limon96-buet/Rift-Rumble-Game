/* Rift Rumble — interface.
   Layout: one full-bleed canvas; HUD and menus are overlays styled like a fight poster
   (slanted condensed display type, gold slabs, hazard stripes). Single dark look by design. */
:root {
  color-scheme: dark;
  --ink: #0c171c;
  --ink-2: #13242b;
  --ink-3: #1e363e;
  --bone: #f4ecd8;
  --mute: #a3b7b4;
  --gold: #ffc02e;
  --rift: #ff4f8b;
  --aqua: #35e0c8;
  --ember: #ff6a3d;
  --line: rgba(244, 236, 216, 0.2);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-ui: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --gut-t: max(10px, env(safe-area-inset-top, 0px));
  --gut-b: max(10px, env(safe-area-inset-bottom, 0px));
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--bone); overflow: hidden; overscroll-behavior: none; }

.rr {
  --ui: 1;
  position: fixed; inset: 0; overflow: hidden;
  font-family: var(--font-ui); font-weight: 600;
  font-size: calc(clamp(13px, 1.9vmin + 6.5px, 19px) * var(--ui));
  line-height: 1.3; color: var(--bone); background: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
.rr.cb { --aqua: #5ab0ff; --ember: #ffa01e; --rift: #d7b5ff; --gold: #ffe27a; }
.rr *, .rr *::before, .rr *::after { box-sizing: border-box; }
.rr :where(button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
.rr :focus-visible { outline: 3px solid var(--aqua); outline-offset: 3px; }
.rr :where(h1, h2, h3, p, ul, dl, dd) { margin: 0; padding: 0; }
[hidden] { display: none !important; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---- screens ------------------------------------------------------------ */
.screen {
  position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 0.7em;
  padding-top: var(--gut-t); padding-bottom: var(--gut-b); padding-left: var(--gut-l); padding-right: var(--gut-r);
  background:
    repeating-linear-gradient(-58deg, rgba(244, 236, 216, 0.035) 0 2px, transparent 2px 22px),
    linear-gradient(100deg, rgba(12, 23, 28, 0.97) 0%, rgba(12, 23, 28, 0.93) 55%, rgba(12, 23, 28, 0.84) 100%);
  touch-action: pan-y;
}
.head { display: flex; align-items: center; gap: 0.9em; flex: none; }
.head h2, .pause h2 { font-family: var(--font-display); font-weight: 900; font-size: 2em; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; font-style: italic; text-wrap: balance; }
.back { min-height: 2.9em; padding: 0 1em 0 0.8em !important; border: 2px solid var(--line) !important; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.85em !important; }
.back::before { content: "‹ "; font-size: 1.4em; line-height: 0; }
.body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-right: 0.3em; }
.foot { flex: none; display: flex; justify-content: flex-end; }
.lead { color: var(--mute); max-width: 62ch; margin-bottom: 0.9em !important; }

/* ---- buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 3em; padding: 0 1.5em !important;
  font-family: var(--font-display); font-weight: 900; font-size: 1.25em !important; text-transform: uppercase; letter-spacing: 0.05em; font-style: italic;
  background: var(--gold) !important; color: var(--ink) !important; transform: skewX(-9deg); transition: transform 0.08s, filter 0.08s;
  box-shadow: 0.28em 0.28em 0 var(--rift);
}
.btn > span { transform: skewX(9deg); display: block; }
.btn:active { transform: skewX(-9deg) translate(0.14em, 0.14em); box-shadow: 0.14em 0.14em 0 var(--rift); }
.btn.big { font-size: 1.65em !important; min-height: 2.5em; }
.btn.ghost { background: rgba(12, 23, 28, 0.6) !important; color: var(--bone) !important; box-shadow: inset 0 0 0 2px var(--line); }
.btn.ghost:active { box-shadow: inset 0 0 0 2px var(--bone); }

/* ---- main menu ---------------------------------------------------------- */
.menu { display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr auto; align-items: center; column-gap: 2em; }
.menu-title { padding-left: 0.4em; }
.tag { display: inline-block; font-size: 0.72em; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); background: var(--bone); padding: 0.15em 0.6em; transform: skewX(-9deg); }
.logo { font-family: var(--font-display); font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 0.82; font-size: min(5.6em, 21vw, 30vh); letter-spacing: -0.01em; margin: 0.12em 0 0.14em !important; }
.logo span { display: block; }
.logo span:last-child { color: var(--gold); text-shadow: 0.045em 0.045em 0 var(--rift); padding-left: 0.32em; }
.tagline { font-size: 1.15em; color: var(--bone); }
.best { margin-top: 0.5em !important; color: var(--gold); font-family: var(--font-display); font-size: 1.2em; letter-spacing: 0.04em; text-transform: uppercase; }
.menu-nav { display: flex; flex-direction: column; gap: 0.85em; align-items: stretch; max-width: 19em; width: 100%; justify-self: end; padding-right: 0.6em; }
.menu-foot { grid-column: 1 / -1; font-size: 0.78em; color: var(--mute); display: flex; flex-wrap: wrap; gap: 0.3em 1.4em; }
.rotate-tip { display: none; color: var(--gold); }

/* ---- fighter select ----------------------------------------------------- */
.roster { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0.8em; }
.fcard { background: var(--ink-2); border: 2px solid var(--line); padding: 0.8em; display: flex; gap: 0.9em; align-items: center; min-width: 0; }
.fcard.sel { border-color: var(--gold); box-shadow: 0.25em 0.25em 0 var(--rift); }
.fcard canvas { width: 6em; height: 6em; flex: none; background: var(--ink-3); }
.fcard .fi { min-width: 0; }
.fcard h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.7em; line-height: 1; text-transform: uppercase; font-style: italic; }
.fcard .role { color: var(--aqua); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.78em; }
.fcard p { color: var(--mute); font-size: 0.9em; margin-top: 0.3em !important; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 0.15em 0.6em; margin-top: 0.5em; font-size: 0.8em; align-items: center; text-transform: uppercase; letter-spacing: 0.08em; }
.pips { display: flex; gap: 3px; }
.pips i { width: 1.25em; height: 0.5em; background: var(--ink-3); transform: skewX(-20deg); }
.pips i.on { background: var(--gold); }
.fcard.locked { flex-direction: column; justify-content: center; text-align: center; color: var(--mute); border-style: dashed; gap: 0.2em; }
.fcard.locked .q { font-family: var(--font-display); font-size: 3em; line-height: 1; color: var(--ink-3); }
.fcard.locked small { font-size: 0.75em; }
.foes-title { margin: 1em 0 0.4em; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.78em; color: var(--mute); }
.foes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6em; }
.foe { background: var(--ink-2); padding: 0.45em 0.6em; display: flex; align-items: center; gap: 0.5em; min-width: 0; border-left: 4px solid var(--ember); }
.foe canvas { width: 2.9em; height: 2.9em; flex: none; }
.foe b { display: block; font-family: var(--font-display); font-size: 1.05em; line-height: 1.05; text-transform: uppercase; }
.foe small { color: var(--mute); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.08em; }

/* ---- arena / setup ------------------------------------------------------ */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 1.1em; align-content: start; }
.arena-card { background: var(--ink-2); border: 2px solid var(--gold); box-shadow: 0.25em 0.25em 0 var(--rift); align-self: start; }
.arena-card canvas { display: block; width: 100%; height: auto; aspect-ratio: 600 / 380; max-height: 40vh; object-fit: cover; }
.arena-info { padding: 0.55em 0.75em 0.7em; }
.arena-info h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.5em; text-transform: uppercase; font-style: italic; line-height: 1.05; }
.arena-info p { color: var(--mute); font-size: 0.86em; }
.setup-opts { display: flex; flex-direction: column; gap: 0.75em; min-width: 0; }
.opt-label { text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.75em; color: var(--mute); margin-bottom: 0.3em; }
.seg { display: flex; flex-wrap: wrap; gap: 0.35em; }
.seg button { min-height: 2.7em; padding: 0 0.95em; background: var(--ink-2); border: 2px solid var(--line); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.9em; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.planned-list { display: flex; flex-wrap: wrap; gap: 0.35em; }
.planned-list span { border: 2px dashed var(--line); color: var(--mute); padding: 0.25em 0.7em; font-size: 0.85em; }

/* ---- how to play / packs ------------------------------------------------ */
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2em; }
.howto h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3em !important; }
.howto ul { list-style: none; display: flex; flex-direction: column; gap: 0.45em; }
.howto li { padding-left: 0.9em; border-left: 3px solid var(--ink-3); font-size: 0.95em; }
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 0.7em; }
.pack { background: var(--ink-2); border: 2px dashed var(--line); padding: 0.75em 0.85em; display: flex; flex-direction: column; gap: 0.3em; }
.pack.installed { border: 2px solid var(--gold); }
.pack h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.3em; text-transform: uppercase; line-height: 1.05; }
.pack p { color: var(--mute); font-size: 0.88em; }
.pill { align-self: flex-start; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.14em; padding: 0.1em 0.55em; border: 1.5px solid var(--mute); color: var(--mute); }
.pack.installed .pill { background: var(--gold); border-color: var(--gold); color: var(--ink); }

/* ---- settings ----------------------------------------------------------- */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(19em, 1fr)); gap: 0.4em 2em; align-items: start; }
.set-group { display: flex; flex-direction: column; margin-bottom: 0.9em; min-width: 0; }
.set-group h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.25em; text-transform: uppercase; color: var(--gold); border-bottom: 2px solid var(--line); padding-bottom: 0.15em !important; margin-bottom: 0.2em !important; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 0.5em 1em; flex-wrap: wrap; min-height: 3.1em; padding: 0.3em 0; border-bottom: 1px solid rgba(244, 236, 216, 0.08); }
.row > label, .row > .lab { flex: 1 1 9em; min-width: 0; }
.row small { display: block; color: var(--mute); font-size: 0.78em; font-weight: 600; }
.tog { min-width: 4.6em; min-height: 2.6em; border: 2px solid var(--line) !important; background: var(--ink-2) !important; text-transform: uppercase; letter-spacing: 0.08em; }
.tog[aria-checked="true"] { background: var(--gold) !important; color: var(--ink) !important; border-color: var(--gold) !important; }
.rng { display: flex; align-items: center; gap: 0.6em; flex: 0 1 13em; min-width: 9em; }
.rng input { flex: 1; min-width: 0; height: 2.4em; accent-color: var(--gold); touch-action: pan-x; }
.rng output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
.about p { color: var(--mute); font-size: 0.86em; margin-top: 0.35em; max-width: 60ch; }
.reset { margin-top: 0.4em !important; min-height: 2.8em; padding: 0 1em !important; border: 2px solid var(--ember) !important; color: var(--ember) !important; text-transform: uppercase; letter-spacing: 0.08em; align-self: flex-start; }

/* ---- pause -------------------------------------------------------------- */
.pause { align-items: center; justify-content: center; gap: 1em; background: rgba(12, 23, 28, 0.9); }
.pause h2 { font-size: 3em; }
.pause .menu-nav { justify-self: auto; padding: 0; }

/* ---- results ------------------------------------------------------------ */
.results { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: 1fr auto; column-gap: 2em; align-items: center; }
.res-main { padding-left: 0.4em; }
.res-main h2 { font-family: var(--font-display); font-weight: 900; font-style: italic; text-transform: uppercase; font-size: min(5em, 17vw, 26vh); line-height: 0.85; }
.results.win .res-main { padding-left: 0.4em; }
.res-main h2 { color: var(--gold); text-shadow: 0.045em 0.045em 0 var(--rift); }
.results.lose .res-main { padding-left: 0.4em; }
.res-main h2 { color: var(--bone); text-shadow: 0.045em 0.045em 0 var(--ink-3); }
.stars { display: flex; gap: 0.3em; margin: 0.5em 0 0.3em; }
.stars i { width: 2em; height: 2em; background: var(--ink-3); clip-path: polygon(50% 0, 62% 35%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 38% 35%); }
.stars i.on { background: var(--gold); }
.res-score { display: flex; align-items: baseline; gap: 0.6em; flex-wrap: wrap; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.85em; color: var(--mute); }
.res-score b { font-family: var(--font-display); font-size: 2.6em; color: var(--bone); letter-spacing: 0; font-variant-numeric: tabular-nums; line-height: 1; }
.res-score em { font-style: normal; color: var(--gold); }
.res-conds { margin-top: 0.5em; display: flex; flex-wrap: wrap; gap: 0.35em; }
.chip { border: 1.5px solid var(--line); padding: 0.1em 0.6em; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.08em; }
.res-stats { display: grid; grid-template-columns: 1fr auto; gap: 0.1em 1.5em; background: var(--ink-2); padding: 0.8em 1em; border-left: 4px solid var(--gold); }
.res-stats dt { color: var(--mute); }
.res-stats dd { text-align: right; font-variant-numeric: tabular-nums; }
.res-nav { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.9em; justify-content: flex-end; padding: 0 0.6em 0.3em 0; }

/* ---- fight card --------------------------------------------------------- */
.card { position: absolute; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; pointer-events: none;
  padding: var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l); background: rgba(12, 23, 28, 0.55); }
.card-in { background: var(--ink); border-top: 0.5em solid var(--gold); border-bottom: 0.5em solid var(--gold); padding: 0.9em 1.6em 1.1em; max-width: 100%; text-align: center; animation: pop 0.28s ease-out; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.22em; font-size: 0.8em; color: var(--mute); }
.card-vs { display: flex; align-items: center; justify-content: center; gap: 0.9em; flex-wrap: wrap; margin: 0.25em 0 0.55em; }
.card-hero, .card-foes { font-family: var(--font-display); font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 0.95; }
.card-hero { font-size: 2.6em; color: var(--aqua); }
.card-foes { font-size: 1.5em; text-align: left; color: var(--bone); }
.card-foes div::before { content: ""; display: inline-block; width: 0.5em; height: 0.5em; background: var(--ember); transform: rotate(45deg); margin-right: 0.45em; vertical-align: 0.1em; }
.card-x { font-family: var(--font-display); font-weight: 900; font-size: 1.6em; background: var(--rift); color: var(--ink); padding: 0 0.4em; transform: skewX(-9deg); }
.card-chips { display: flex; flex-wrap: wrap; gap: 0.4em; justify-content: center; }
.card-chips .chip b { color: var(--gold); font-weight: 600; }
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---- HUD ---------------------------------------------------------------- */
.hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.rr.paused .hud { visibility: hidden; }
.hud.has-banner .hint { visibility: hidden; }
.hud-top { position: absolute; top: var(--gut-t); left: var(--gut-l); right: var(--gut-r); display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6em; }
.vitals { background: rgba(12, 23, 28, 0.78); padding: 0.4em 0.65em 0.45em; min-width: 11.5em; max-width: 44%; border-left: 4px solid var(--aqua); display: flex; flex-direction: column; gap: 0.22em; }
.vit-name { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 1.05em; line-height: 1; letter-spacing: 0.03em; }
.bar { display: flex; align-items: center; gap: 0.4em; }
.bar-tag { font-size: 0.68em; letter-spacing: 0.1em; width: 2.2em; color: var(--mute); }
.bar-track { flex: 1; height: 0.95em; background: #05090c; position: relative; overflow: hidden; min-width: 4em; }
.bar-fill { position: absolute; inset: 0; transform-origin: left center; background: var(--bone); }
.hp .bar-track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), #05090c calc(10% - 2px) 10%); }
.st .bar-track { height: 0.5em; }
.st .bar-fill { background: var(--aqua); }
.bar-num { font-variant-numeric: tabular-nums; font-size: 0.9em; min-width: 1.9em; text-align: right; }
.bar-low { font-size: 0.68em; letter-spacing: 0.1em; background: var(--ember); color: var(--ink); padding: 0 0.35em; animation: blink 0.7s steps(2) infinite; }
.hp.low .bar-fill { background: repeating-linear-gradient(-45deg, var(--ember) 0 5px, var(--bone) 5px 10px); }
@keyframes blink { 50% { opacity: 0.35; } }
.weapon { display: flex; align-items: center; gap: 0.4em; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.06em; }
.weapon canvas { width: 1.7em; height: 1.7em; background: #05090c; border: 1.5px solid var(--gold); border-radius: 50%; }
.weapon b { color: var(--gold); font-variant-numeric: tabular-nums; }
.objective { background: rgba(12, 23, 28, 0.78); padding: 0.35em 0.8em 0.4em; text-align: center; border-bottom: 3px solid var(--gold); }
.obj-main { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 1.15em; letter-spacing: 0.04em; line-height: 1.1; white-space: nowrap; }
.obj-main b { color: var(--gold); }
.obj-sub { font-size: 0.78em; color: var(--mute); display: flex; gap: 0.6em; justify-content: center; font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.pause-btn { pointer-events: auto; width: 3.6em; height: 3.6em; background: rgba(12, 23, 28, 0.78) !important; border: 2px solid var(--line) !important; display: flex !important; align-items: center; justify-content: center; gap: 0.38em; flex: none; }
.pause-btn i { width: 0.38em; height: 1.2em; background: var(--bone); }
.hint { position: absolute; top: calc(var(--gut-t) + 4.4em); left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--ink); padding: 0.4em 1em; max-width: min(34em, 80%); text-align: center; font-size: 1.02em; box-shadow: 0.22em 0.22em 0 var(--ink); }
.banner { position: absolute; top: 27%; left: 0; right: 0; text-align: center; animation: pop 0.2s ease-out; padding: 0 var(--gut-r) 0 var(--gut-l); }
#banner-main { font-family: var(--font-display); font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 2.6em; line-height: 0.95; color: var(--bone); -webkit-text-stroke: 0.14em var(--ink); paint-order: stroke fill; text-shadow: 0.06em 0.06em 0 var(--rift); }
.banner.big #banner-main { font-size: 5em; color: var(--gold); }
#banner-sub { text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.85em; color: var(--bone); background: var(--ink); display: inline-block; padding: 0 0.6em; }
#banner-sub:empty { display: none; }
.subtitle { position: absolute; bottom: calc(var(--gut-b) + 2.2em); left: 50%; transform: translateX(-50%); max-width: min(32em, 46%); background: rgba(5, 9, 12, 0.86); padding: 0.3em 0.8em; text-align: center; font-size: 1em; }
.touch-on .subtitle { bottom: calc(var(--gut-b) + 0.4em); }
.subtitle b { color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 0.45em; }
.keys { position: absolute; bottom: var(--gut-b); left: 50%; transform: translateX(-50%); font-size: 0.74em; color: var(--mute); background: rgba(12, 23, 28, 0.7); padding: 0.15em 0.7em; white-space: nowrap; letter-spacing: 0.04em; }
.touch-on .keys { display: none; }
.fps { position: absolute; top: calc(var(--gut-t) + 3.6em); right: var(--gut-r); font-size: 0.75em; color: var(--gold); background: rgba(5, 9, 12, 0.7); padding: 0 0.4em; font-variant-numeric: tabular-nums; }

/* ---- touch controls ----------------------------------------------------- */
.touch { display: none; }
.touch-on .touch { display: block; }
#stick-zone { position: absolute; left: 0; bottom: 0; top: 24%; width: 46%; pointer-events: auto; touch-action: none; }
#stick-ghost { position: absolute; left: calc(var(--gut-l) + 2.2em); bottom: calc(var(--gut-b) + 2.2em); width: 6.6em; height: 6.6em; border-radius: 50%; border: 2px dashed rgba(244, 236, 216, 0.35); }
#stick-ghost::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; background: rgba(244, 236, 216, 0.2); }
#stick-base { position: absolute; width: 7.2em; height: 7.2em; margin: -3.6em 0 0 -3.6em; border-radius: 50%; background: rgba(12, 23, 28, 0.5); border: 2px solid rgba(244, 236, 216, 0.55); }
#stick-zone.active #stick-ghost { display: none; }
#stick-knob { position: absolute; left: 50%; top: 50%; width: 3.3em; height: 3.3em; border-radius: 50%; background: var(--aqua); transform: translate(-50%, -50%); box-shadow: 0 0 0 3px var(--ink); }
.tbtn { position: absolute; pointer-events: auto; border-radius: 50%; width: 4.4em; height: 4.4em; right: calc(var(--gut-r) + var(--x)); bottom: calc(var(--gut-b) + var(--y));
  background: rgba(12, 23, 28, 0.72) !important; border: 2.5px solid var(--bone) !important; font-family: var(--font-display); font-weight: 900; font-size: 1em !important; letter-spacing: 0.04em; touch-action: none; }
.tbtn span { display: block; font-size: 0.95em; }
.tbtn.down { background: var(--bone) !important; color: var(--ink) !important; transform: scale(0.94); }
.tbtn.atk { --x: 0.3em; --y: 0.5em; width: 5.9em; height: 5.9em; background: var(--gold) !important; color: var(--ink) !important; border-color: var(--ink) !important; box-shadow: 0 0 0 3px var(--gold); }
.tbtn.atk span { font-size: 1.25em; }
.tbtn.atk.down { background: var(--bone) !important; box-shadow: 0 0 0 3px var(--bone); }
.tbtn.blk { --x: 6.9em; --y: 0.4em; }
.tbtn.ddg { --x: 5.9em; --y: 5.3em; }
.tbtn.swp { --x: 0.9em; --y: 7.1em; width: 4em; height: 4em; border-color: var(--gold) !important; }
.tbtn.swp.take { background: var(--gold) !important; color: var(--ink) !important; }
.tbtn.swp.off { opacity: 0.4; }
.lefty #stick-zone { left: auto; right: 0; }
.lefty #stick-ghost { left: auto; right: calc(var(--gut-r) + 2.2em); }
.lefty .tbtn { right: auto; left: calc(var(--gut-l) + var(--x)); }

.toast { position: absolute; z-index: 40; left: 50%; bottom: calc(var(--gut-b) + 1em); transform: translateX(-50%); background: var(--bone); color: var(--ink); padding: 0.4em 1em; }

/* ---- narrow / portrait -------------------------------------------------- */
@media (orientation: portrait) {
  .menu { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; align-content: center; row-gap: 1.6em; }
  .menu-nav { justify-self: stretch; max-width: none; padding-right: 0.5em; }
  .rotate-tip { display: inline; }
  .roster { grid-template-columns: 1fr 1fr; }
  .roster .fcard.sel { grid-column: 1 / -1; }
  .foes { grid-template-columns: 1fr 1fr; }
  .setup, .cols { grid-template-columns: 1fr; }
  .results { grid-template-columns: 1fr; grid-template-rows: auto auto auto; align-content: center; row-gap: 1.2em; }
  .res-nav { justify-content: stretch; flex-direction: column; padding-right: 0.5em; }
  .subtitle, .touch-on .subtitle { bottom: calc(var(--gut-b) + 12.5em); max-width: 88%; }
  .vitals { min-width: 9.4em; }
  .objective { min-width: 0; padding: 0.35em 0.5em 0.4em; }
  .obj-main { font-size: 1em; }
  .obj-sub { flex-direction: column; gap: 0; white-space: normal; }
  .hint { top: calc(var(--gut-t) + 8.6em); max-width: 92%; width: max-content; }
  .banner { top: 30%; }
  #banner-main { font-size: 2.2em; }
  #stick-zone { top: 45%; }
}
@media (max-height: 430px) and (orientation: landscape) {
  .screen { gap: 0.45em; }
  .head h2 { font-size: 1.6em; }
  .fcard canvas { width: 4.6em; height: 4.6em; }
}
@media (prefers-reduced-motion: reduce) {
  .card-in, .banner { animation: none; }
  .bar-low { animation: none; }
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="rr" class="rr">
  <canvas id="cv" aria-hidden="true"></canvas>

  <!-- In-match HUD -->
  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="vitals">
        <div class="vit-name" id="hud-name"></div>
        <div class="bar hp">
          <span class="bar-tag" data-i18n="hud.hp"></span>
          <div class="bar-track" id="hp-track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" data-i18n-aria="hud.hp"><div class="bar-fill" id="hp-fill"></div></div>
          <span class="bar-num" id="hp-num">100</span>
          <span class="bar-low" id="hp-low" data-i18n="hud.low" hidden></span>
        </div>
        <div class="bar st">
          <span class="bar-tag" data-i18n="hud.st"></span>
          <div class="bar-track" id="st-track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" data-i18n-aria="hud.st"><div class="bar-fill" id="st-fill"></div></div>
        </div>
        <div class="weapon" id="weapon"><canvas id="w-icon" width="44" height="44"></canvas><span id="w-name"></span><b id="w-uses"></b></div>
      </div>
      <div class="objective">
        <div class="obj-main"><span data-i18n="hud.opponents"></span> <b id="obj-count">0/3</b></div>
        <div class="obj-sub"><span id="obj-time">0:00</span><span id="obj-conds"></span></div>
      </div>
      <button id="btn-pause" class="pause-btn" type="button" data-i18n-aria="hud.pause"><i></i><i></i></button>
    </div>
    <div id="hint" class="hint" role="status" hidden></div>
    <div id="banner" class="banner" hidden><div id="banner-main"></div><div id="banner-sub"></div></div>
    <div id="subtitle" class="subtitle" hidden><b id="sub-who"></b><span id="sub-line"></span></div>
    <div id="keys" class="keys" data-i18n="hud.keys"></div>
    <div id="fps" class="fps" hidden></div>
    <div id="touch" class="touch">
      <div id="stick-zone"><div id="stick-ghost"></div><div id="stick-base" hidden><div id="stick-knob"></div></div></div>
      <button id="btn-attack" class="tbtn atk" type="button"><span data-i18n="btn.attack"></span></button>
      <button id="btn-block" class="tbtn blk" type="button"><span data-i18n="btn.block"></span></button>
      <button id="btn-dodge" class="tbtn ddg" type="button"><span data-i18n="btn.dodge"></span></button>
      <button id="btn-swap" class="tbtn swp" type="button"><span id="swap-label"></span></button>
    </div>
  </div>

  <!-- Fight card shown while a match loads in -->
  <div id="card" class="card" hidden>
    <div class="card-in">
      <div class="eyebrow" data-i18n="intro.tonight"></div>
      <div class="card-vs">
        <div class="card-hero" id="card-hero"></div>
        <div class="card-x" data-i18n="intro.vs"></div>
        <div class="card-foes" id="card-foes"></div>
      </div>
      <div class="card-chips" id="card-chips"></div>
    </div>
  </div>

  <!-- Main menu -->
  <section id="s-menu" class="screen menu">
    <div class="menu-title">
      <div class="tag" data-i18n="app.working"></div>
      <h1 class="logo"><span data-i18n="app.title.a"></span><span data-i18n="app.title.b"></span></h1>
      <p class="tagline" data-i18n="app.tagline"></p>
      <p class="best" id="menu-best" hidden></p>
    </div>
    <nav class="menu-nav">
      <button class="btn big" type="button" id="m-play" data-go="fighter"><span data-i18n="menu.play"></span></button>
      <button class="btn ghost" type="button" id="m-howto" data-go="howto"><span data-i18n="menu.howto"></span></button>
      <button class="btn ghost" type="button" id="m-settings" data-go="settings"><span data-i18n="menu.settings"></span></button>
      <button class="btn ghost" type="button" id="m-packs" data-go="packs"><span data-i18n="menu.packs"></span></button>
    </nav>
    <p class="menu-foot"><span data-i18n="menu.build"></span><span class="rotate-tip" data-i18n="menu.rotate"></span></p>
  </section>

  <!-- Fighter select -->
  <section id="s-fighter" class="screen" hidden>
    <header class="head"><button class="back" type="button" data-back><span data-i18n="ui.back"></span></button><h2 data-i18n="fighter.title"></h2></header>
    <div class="body">
      <div class="roster" id="roster"></div>
      <div class="foes-title" data-i18n="fighter.opponents"></div>
      <div class="foes" id="foes"></div>
    </div>
    <footer class="foot"><button class="btn big" type="button" id="f-next" data-go="arena"><span data-i18n="fighter.next"></span></button></footer>
  </section>

/* Rift Rumble — settings and small saved data (device-local only; nothing leaves the device). */
(function () {
  const RR = (window.RR = window.RR || {});
  const KEY = 'riftrumble.v1';

  RR.DEFAULTS = {
    language: 'en',
    hints: true,
    layout: 'right', // 'right' | 'left'
    touch: 'auto', // 'auto' | 'always'
    uiScale: 1, // 0.8 .. 1.3
    cam: 1, // 0.5 .. 1.5
    vibrate: true,
    master: 0.8,
    sfx: 0.9,
    music: 0.5,
    voice: true,
    subs: true,
    quality: 'med', // 'low' | 'med' | 'high'
    fps30: false,
    showFps: false,
    shake: true,
    colorblind: false,
    // match setup (remembered between matches)
    cond: 'random',
    supply: 'random',
    diff: 'normal',
  };

  const store = { settings: Object.assign({}, RR.DEFAULTS), best: 0, hintsDone: false, plays: 0 };

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data && typeof data === 'object') {
        if (data.settings) {
          for (const k in RR.DEFAULTS) {
            if (typeof data.settings[k] === typeof RR.DEFAULTS[k]) store.settings[k] = data.settings[k];
          }
        }
        store.best = +data.best || 0;
        store.hintsDone = !!data.hintsDone;
        store.plays = +data.plays || 0;
      }
    } catch (e) {
      /* storage blocked or empty: run with defaults */
    }
  }

  function save() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(store));
    } catch (e) {
      /* ignore */
    }
  }

  const listeners = [];
  RR.settings = store.settings;
  RR.save = store;
  RR.persist = save;
  RR.onSetting = (fn) => listeners.push(fn);
  RR.setSetting = function (key, value) {
    store.settings[key] = value;
    save();
    listeners.forEach((fn) => fn(key, value));
  };
  RR.resetSettings = function () {
    for (const k in RR.DEFAULTS) store.settings[k] = RR.DEFAULTS[k];
    store.hintsDone = false;
    save();
    listeners.forEach((fn) => fn('*'));
  };

  load();
  if (!RR.LOCALES[store.settings.language]) store.settings.language = 'en';
  RR.locale = store.settings.language;
})();

/* ---- audio.js ---- */
/* Rift Rumble — audio. Every sound is synthesized with Web Audio, so the game ships no audio files. */
(function () {
  const RR = (window.RR = window.RR || {});
  let ctx = null, master, sfxBus, musicBus, noiseBuf, rainNode = null, rainGain = null;
  let musicMode = 'off', musicTimer = null, step = 0, nextTime = 0;

  function init() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return true;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      sfxBus = ctx.createGain();
      musicBus = ctx.createGain();
      sfxBus.connect(master);
      musicBus.connect(master);
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyVolumes();
      return true;
    } catch (e) {
      ctx = null;
      return false;
    }
  }

  function applyVolumes() {
    if (!ctx) return;
    const s = RR.settings;
    master.gain.value = s.master;
    sfxBus.gain.value = s.sfx;
    musicBus.gain.value = s.music * 0.55;
  }

  function tone(type, f0, f1, dur, vol, delay, bus) {
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(bus || sfxBus);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(dur, vol, ftype, f0, f1, delay, bus) {
    const t = ctx.currentTime + (delay || 0);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf;
    src.loop = true;
    f.type = ftype;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(bus || sfxBus);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.02);

    punch() { noise(0.07, 0.5, 'lowpass', 900, 200); tone('sine', 150, 60, 0.1, 0.55); },
    heavy() { noise(0.12, 0.7, 'lowpass', 1200, 150); tone('sine', 120, 40, 0.2, 0.75); },
    swing() { noise(0.13, 0.2, 'bandpass', 600, 2400); },
    slash() { noise(0.09, 0.4, 'highpass', 2200, 2200); tone('triangle', 900, 300, 0.12, 0.22); },
    bow() { tone('triangle', 320, 140, 0.12, 0.3); noise(0.05, 0.12, 'highpass', 3000, 3000); },
    arrowhit() { noise(0.05, 0.35, 'bandpass', 1200, 1200); tone('sine', 200, 90, 0.08, 0.35); },
    rifle() { noise(0.22, 0.7, 'lowpass', 3200, 300); tone('square', 110, 40, 0.16, 0.3); },
    thunk() { noise(0.05, 0.25, 'bandpass', 700, 400); },
    block() { tone('square', 520, 380, 0.06, 0.2); noise(0.05, 0.25, 'bandpass', 2500, 2500); },
    parry() { tone('triangle', 1320, 1320, 0.22, 0.3); tone('triangle', 1980, 1980, 0.3, 0.18, 0.03); },
    guardbreak() { noise(0.2, 0.5, 'lowpass', 2000, 200); tone('sawtooth', 300, 80, 0.25, 0.3); },
    dodge() { noise(0.18, 0.2, 'bandpass', 400, 1700); },
    hurt() { tone('sawtooth', 230, 110, 0.12, 0.25); noise(0.06, 0.3, 'lowpass', 800, 300); },
    pickup() { tone('sine', 520, 780, 0.09, 0.28); tone('sine', 780, 1040, 0.1, 0.24, 0.08); },
    heal() { tone('sine', 440, 660, 0.12, 0.25); tone('sine', 660, 880, 0.12, 0.22, 0.1); tone('sine', 880, 1320, 0.16, 0.2, 0.2); },
    broken() { noise(0.12, 0.35, 'highpass', 1500, 600); tone('square', 300, 120, 0.14, 0.18); },
    ui() { tone('square', 660, 660, 0.04, 0.1); },
    uiback() { tone('square', 440, 440, 0.04, 0.1); },
    spawn() { tone('sawtooth', 90, 240, 0.4, 0.2); noise(0.35, 0.2, 'bandpass', 300, 1800); },
    crate() { noise(0.2, 0.6, 'lowpass', 700, 120); tone('sine', 90, 40, 0.25, 0.6); },
    warn() { tone('square', 980, 980, 0.05, 0.08); },
    ko() { noise(0.3, 0.6, 'lowpass', 1500, 100); tone('sine', 180, 35, 0.4, 0.7); },
    fight() { tone('sawtooth', 220, 440, 0.18, 0.25); tone('sawtooth', 330, 660, 0.3, 0.25, 0.12); noise(0.3, 0.3, 'highpass', 4000, 1500, 0.1); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.28, 0.3, i * 0.13)); tone('triangle', 1319, 1319, 0.6, 0.3, 0.55); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone('sawtooth', f, f * 0.97, 0.32, 0.2, i * 0.2)); },
  };

  const BASS = [73.4, 0, 73.4, 0, 87.3, 0, 73.4, 73.4, 65.4, 0, 65.4, 0, 55, 0, 65.4, 82.4];
  const LEAD = [0, 0, 587, 0, 0, 523, 0, 0, 0, 0, 440, 0, 523, 0, 0, 0];

        if (s % 4 === 2) noise(0.04, 0.18, 'highpass', 7000, 7000, d, musicBus);
        if (s === 4 || s === 12) noise(0.1, 0.3, 'bandpass', 1800, 1200, d, musicBus);

      } else if (LEAD[s] && s % 2 === 0) {
        tone('triangle', LEAD[s] / 2, LEAD[s] / 2, stepDur * 6, 0.1, d, musicBus);
      }
      nextTime += stepDur;
      step++;

  }

    init,
    applyVolumes,
    sfx(name) {
      if (!ctx || ctx.state !== 'running' || !SFX[name]) return;

    },
    music(mode) {
      musicMode = mode;
      if (!ctx) return;
      if (mode === 'off') {
        if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
        return;
      }
      if (!musicTimer) {
        nextTime = ctx.currentTime + 0.05;
        step = 0;
        musicTimer = setInterval(schedule, 60);
      }
    },
    rain(on) {
      if (!ctx) return;
      if (on && !rainNode) {
        rainNode = ctx.createBufferSource();
        rainNode.buffer = noiseBuf;
        rainNode.loop = true;
        const f = ctx.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = 2200;
        f.Q.value = 0.4;

        rainNode.connect(f);
        f.connect(rainGain);
        rainGain.connect(sfxBus);
        rainNode.start();

        try { rainNode.stop(); } catch (e) { /* ignore */ }
        rainNode = null;
      }
    },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); },
    // Voice lines: Android wrapper bridge first, then the browser speech voice. Text only if neither exists.
    speak(text) {
      const s = RR.settings;
      if (!s.voice || s.master <= 0) return;
      try {
        if (window.RRNative && window.RRNative.speak) {
          window.RRNative.speak(text, s.master);
          return;
        }
        const synth = window.speechSynthesis;
        if (!synth || typeof window.SpeechSynthesisUtterance !== 'function') return;
        synth.cancel();
        const u = new window.SpeechSynthesisUtterance(text);
        u.lang = RR.locale;
        u.rate = 1.08;
        u.pitch = 0.9;
        u.volume = Math.min(1, s.master);
        synth.speak(u);
      } catch (e) { /* speech not available */ }
    },
    hush() {
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    },
    get state() { return ctx ? ctx.state : 'none'; },
  };

    if (!RR.settings.vibrate) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  };
})();

/* ---- input.js ---- */
/* Rift Rumble — input: keyboard plus on-screen touch stick and buttons. */
(function () {
  const RR = (window.RR = window.RR || {});
  const keys = new Set();
  const st = { mx: 0, my: 0, attackPressed: false, block: false, dodgePressed: false, swapPressed: false };
  const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
  let touchBlock = false, pausePressed = false, coarse = false, sawTouch = false;

  const MOVE = {
    KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1],
    KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0],
  };
  const GAME_KEYS = new Set(['Space', 'KeyJ', 'KeyK', 'KeyL', 'KeyQ', 'ShiftLeft', 'ShiftRight', ...Object.keys(MOVE)]);

  function refreshTouchVisibility() {
    const on = RR.settings.touch === 'always' || coarse || sawTouch;
    document.getElementById('rr').classList.toggle('touch-on', on);
    RR.input.touchMode = on;
  }

  function onKeyDown(e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code === 'Escape' || e.code === 'KeyP') { if (!e.repeat) pausePressed = true; e.preventDefault(); return; }
    if (!RR.app || !RR.app.inMatch) return;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    if (e.repeat) return;
    keys.add(e.code);
    if (e.code === 'KeyJ' || e.code === 'Space') st.attackPressed = true;
    else if (e.code === 'KeyL') st.dodgePressed = true;
    else if (e.code === 'KeyQ') st.swapPressed = true;
    if (sawTouch && !coarse && RR.settings.touch !== 'always') { sawTouch = false; refreshTouchVisibility(); }
  }
  function onKeyUp(e) { keys.delete(e.code); }

  function bindButton(id, down, up) {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      noteTouch(e);
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      el.classList.add('down');
      down();
    });
    const release = () => { el.classList.remove('down'); if (up) up(); };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function noteTouch(e) {
    if (e.pointerType === 'touch' && !sawTouch) { sawTouch = true; refreshTouchVisibility(); }
    RR.audio.init();
  }

  function setupStick() {
    const zone = document.getElementById('stick-zone'), base = document.getElementById('stick-base'), knob = document.getElementById('stick-knob');
    const radius = () => base.offsetWidth * 0.5 || 50;
    zone.addEventListener('pointerdown', (e) => {
      if (stick.id !== null) return;
      e.preventDefault();
      noteTouch(e);
      stick.id = e.pointerId;
      const r = zone.getBoundingClientRect();
      stick.ox = e.clientX; stick.oy = e.clientY; stick.x = 0; stick.y = 0;
      base.hidden = false;
      zone.classList.add('active');
      base.style.left = e.clientX - r.left + 'px';
      base.style.top = e.clientY - r.top + 'px';
      knob.style.transform = 'translate(-50%,-50%)';
      try { zone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    zone.addEventListener('pointermove', (e) => {
      if (e.pointerId !== stick.id) return;
      const R = radius();
      let dx = (e.clientX - stick.ox) / R, dy = (e.clientY - stick.oy) / R;
      const l = Math.hypot(dx, dy);
      if (l > 1) { dx /= l; dy /= l; }
      stick.x = dx; stick.y = dy;
      knob.style.transform = 'translate(calc(-50% + ' + dx * R + 'px), calc(-50% + ' + dy * R + 'px))';
    });
    const end = (e) => {
      if (e.pointerId !== stick.id) return;
      stick.id = null; stick.x = 0; stick.y = 0;
      base.hidden = true;
      zone.classList.remove('active');
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
    zone.addEventListener('lostpointercapture', end);
    zone.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  RR.input = {
    touchMode: false,
    init() {
      try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) { coarse = false; }
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('blur', () => RR.input.reset());
      setupStick();
      bindButton('btn-attack', () => { st.attackPressed = true; });
      bindButton('btn-block', () => { touchBlock = true; }, () => { touchBlock = false; });
      bindButton('btn-dodge', () => { st.dodgePressed = true; });
      bindButton('btn-swap', () => { st.swapPressed = true; });
      RR.onSetting((k) => { if (k === 'touch' || k === '*') refreshTouchVisibility(); });
      refreshTouchVisibility();
    },
    // called once per simulated frame
    state() {
      let mx = 0, my = 0;
      for (const k of keys) { const m = MOVE[k]; if (m) { mx += m[0]; my += m[1]; } }
      const l = Math.hypot(stick.x, stick.y);
      if (l > 0.14) { mx += stick.x; my += stick.y; }
      st.mx = Math.max(-1, Math.min(1, mx));
      st.my = Math.max(-1, Math.min(1, my));
      st.block = touchBlock || keys.has('KeyK') || keys.has('ShiftLeft') || keys.has('ShiftRight');
      return st;
    },
    endFrame() { st.attackPressed = st.dodgePressed = st.swapPressed = false; },
    takePause() { const p = pausePressed; pausePressed = false; return p; },
    reset() {
      keys.clear();
      touchBlock = false;
      st.attackPressed = st.dodgePressed = st.swapPressed = false;
      stick.id = null; stick.x = stick.y = 0;
      const base = document.getElementById('stick-base');
      if (base) { base.hidden = true; base.parentElement.classList.remove('active'); }
    },
    get usingKeys() { return !RR.input.touchMode; },
  };
})();

/* Rift Rumble — match simulation: fighters, combat, opponents, pickups, conditions.
 * No drawing and no DOM here. The renderer reads RR.game.M; the UI drains RR.game.events.

(function () {
  const RR = (window.RR = window.RR || {});

  }

  function segCircle(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;

    const disc = b * b - 4 * a * c;

  function los(x1, y1, x2, y2) {
    const obs = M.arena.obstacles;
    for (let i = 0; i < obs.length; i++) if (segObstacle(x1, y1, x2, y2, obs[i]) >= 0) return false;
    return true;
  }
  // distance from point to obstacle surface, plus outward normal
  function obstacleNear(o, x, y, out) {
    if (o.r) {
      const dx = x - o.x, dy = y - o.y, d = hyp(dx, dy) || 0.001;
      out.d = d - o.r; out.nx = dx / d; out.ny = dy / d;
    } else {
      const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
      const dx = x - cx, dy = y - cy, d = hyp(dx, dy);
      if (d > 0.001) { out.d = d; out.nx = dx / d; out.ny = dy / d; }
      else { out.d = 0; out.nx = x < o.x + o.w / 2 ? -1 : 1; out.ny = 0; }
    }
    return out;
  }
  function collideWorld(f) {
    const A = M.arena, m = A.wall + f.r;
    f.x = clamp(f.x, m, A.w - m);
    f.y = clamp(f.y, m, A.h - m);
    const obs = A.obstacles;
    for (let i = 0; i < obs.length; i++) {
      const o = obs[i];
      if (o.r) {
        let dx = f.x - o.x, dy = f.y - o.y, d = hyp(dx, dy);
        const min = f.r + o.r;
        if (d < min) {
          if (d < 0.001) { dx = 1; dy = 0; d = 1; }
          f.x = o.x + (dx / d) * min;
          f.y = o.y + (dy / d) * min;
        }
      } else {
        const cx = clamp(f.x, o.x, o.x + o.w), cy = clamp(f.y, o.y, o.y + o.h);
        const dx = f.x - cx, dy = f.y - cy, d2 = dx * dx + dy * dy;
        if (d2 < f.r * f.r) {
          if (d2 > 1e-6) {
            const d = Math.sqrt(d2);
            f.x = cx + (dx / d) * f.r;
            f.y = cy + (dy / d) * f.r;
          } else {
            const l = f.x - o.x, r = o.x + o.w - f.x, t = f.y - o.y, b = o.y + o.h - f.y, mn = Math.min(l, r, t, b);
            if (mn === l) f.x = o.x - f.r; else if (mn === r) f.x = o.x + o.w + f.r;
            else if (mn === t) f.y = o.y - f.r; else f.y = o.y + o.h + f.r;
          }
        }
      }
    }
  }

  /* ---- effects (data only; drawn by the renderer) ---------------------- */
  function particles(x, y, n, speed, color, life, size) {
    const cap = RR.fxCap || 140;
    for (let i = 0; i < n && M.particles.length < cap; i++) {
      const a = Math.random() * TAU, s = speed * (0.35 + Math.random() * 0.65);
      M.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, size: size || 3, color });
    }
  }
  function floatText(x, y, txt, kind) {
    M.texts.push({ x: x + (Math.random() - 0.5) * 14, y, txt, kind, life: 0.8, max: 0.8 });
    if (M.texts.length > 24) M.texts.shift();
  }

  /* ---- fighters -------------------------------------------------------- */
  function makeFighter(id, team, x, y) {
    const def = RR.FIGHTERS[id];
    const hp = team === 'enemy' ? Math.round(def.hp * M.diff.enemyHp) : def.hp;
    return {
      id, def, team, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r, face: 0,
      hp, maxHp: hp, st: def.st || 0, maxSt: def.st || 0,
      state: 'idle', stT: 0, atk: null, combo: 0, comboT: 0,
      weapon: null, useFists: false, blocking: false, blockStart: -9, guardLock: false,
      iframes: 0, flash: 0, spawnT: team === 'enemy' ? 0.9 : 0, deadT: 0,
      cool: rand(0.5, 1.1), side: rng() < 0.5 ? -1 : 1, sideT: 0, blockT: 0, hopT: 0,
      dodgeA: 0, dodgeReady: 0, lastSt: -9, buf: 0, walk: 0, age: 0, armorT: 0, streak: 0, lastHitT: -9,
    };
  }
  const alive = (f) => f.state !== 'dead';
  function wepOf(f) {
    if (f.team === 'enemy') return RR.WEAPONS[f.def.weapon];
    if (f.weapon && !f.useFists) return RR.WEAPONS[f.weapon.id];
    return RR.WEAPONS.fists;
  }
  function spendSt(f, n) {
    f.st = Math.max(0, f.st - n);
    f.lastSt = M.t;
  }
  function stagger(f, t) {
    f.atk = null;
    f.state = 'stagger';
    f.stT = t;
    f.blocking = false;
    f.blockT = 0;
    f.hopT = 0;
    f.vx = f.vy = 0;
  }
  const enemies = () => M.fighters.filter((f) => f.team === 'enemy');
  function attackers() {
    let n = 0;
    for (const f of M.fighters) if (f.team === 'enemy' && f.atk && f.atk.phase !== 'r') n++;
    return n;
  }
  function nearestEnemy(p, maxD, needLos) {
    let best = null, bd = maxD;
    for (const f of M.fighters) {
      if (f.team === p.team || !alive(f) || f.spawnT > 0) continue;
      const d = hyp(f.x - p.x, f.y - p.y);
      if (d < bd && (!needLos || los(p.x, p.y, f.x, f.y))) { bd = d; best = f; }
    }
    return best;
  }

  /* ---- attacks --------------------------------------------------------- */
  function startAttack(f, aim) {
    const W = wepOf(f), isP = f.team === 'player';
    if (isP) {
      if (f.st < W.st * 0.5) return false;
      spendSt(f, W.st);
      M.stats.attacks++;
    }
    if (f.comboT <= 0) f.combo = 0;
    const idx = f.combo % W.moves.length, mv = W.moves[idx];
    const wm = isP ? 1 : M.diff.windup;
    f.atk = { W, mv, idx, phase: 'w', t: 0, wd: mv.w * wm, ad: mv.a, rd: mv.r, hit: [], landed: false };
    f.combo++;
    f.comboT = 0.7 + mv.w + mv.a + mv.r;
    f.face = aim;
    f.state = 'attack';
    f.blocking = false;
    if (isP) {
      // an opponent who can guard may react to the start of a swing
      for (const e of M.fighters) {
        const A = e.def.ai;
        if (e.team !== 'enemy' || !A || !A.block || e.state !== 'idle' || e.blockT > 0 || e.spawnT > 0) continue;
        if (W.kind === 'melee' && hyp(e.x - f.x, e.y - f.y) < W.range + 70 && rng() < A.block) e.blockT = 0.55;
      }
    } else if (W.kind === 'ranged') sfx('warn');
    return true;
  }

  function fire(f, W) {
    const c = Math.cos(f.face), s = Math.sin(f.face), ox = f.x + c * (f.r + 8), oy = f.y + s * (f.r + 8);
    M.projectiles.push({
      x: ox, y: oy, px: f.x, py: f.y, vx: c * W.proj.speed, vy: s * W.proj.speed, a: f.face,
      team: f.team, owner: f, dmg: W.proj.dmg, knock: W.proj.knock, kind: W.proj.kind, life: 1.5, skip: null,
    });
    sfx(W.proj.kind === 'arrow' ? 'bow' : 'rifle');
    if (W.proj.kind === 'bolt') {
      particles(ox, oy, 5, 160, 'spark', 0.18, 3);
      if (f.team === 'player') M.shake = Math.max(M.shake, 5);
    }
  }

  function updateAttack(f, dt, track) {
    const a = f.atk, W = a.W;
    a.t += dt;
    let lunge = 0;
    if (a.phase === 'w') {
      if (track !== null && a.wd - a.t > (W.kind === 'ranged' ? 0.24 : 0.17)) f.face = turnToward(f.face, track, (W.kind === 'ranged' ? 5 : 4) * dt);
      if (W.kind === 'melee' && a.t > a.wd * 0.45) lunge = W.lunge / (a.wd * 0.55 + a.ad);
      if (a.t >= a.wd) {
        a.phase = 'a';
        a.t = 0;
        if (W.kind === 'ranged') fire(f, W); else sfx('swing');
        if (f.team === 'player' && f.weapon && !f.useFists) f.weapon.uses--;
      }
    } else if (a.phase === 'a') {
      if (W.kind === 'melee') {
        lunge = W.lunge / (a.wd * 0.55 + a.ad);
        for (const t of M.fighters) {
          if (t.team === f.team || !alive(t) || a.hit.indexOf(t) >= 0) continue;
          const dx = t.x - f.x, dy = t.y - f.y, d = hyp(dx, dy);
          if (d > W.range + t.r * 0.5) continue;
          const ang = Math.atan2(dy, dx);
          if (Math.abs(angDiff(ang, f.face)) > W.arc / 2) continue;
          a.hit.push(t);
          const res = applyHit(f, t, a.mv.dmg, a.mv.knock, ang, 'melee', !!a.mv.heavy, W);
          if (!f.atk) return; // attacker was parried
          if (res !== 'none' && res !== 'dodged' && f.team === 'player' && !a.landed) { a.landed = true; M.stats.hits++; }
        }
      }
      if (a.t >= a.ad) { a.phase = 'r'; a.t = 0; }
    } else if (a.t >= a.rd) {
      f.atk = null;
      f.state = 'idle';
      if (f.team === 'enemy') {
        const A = f.def.ai;
        f.cool = rand(A.cd[0], A.cd[1]) * M.diff.cd;
        if (A.hop && rng() < A.hop) f.hopT = 0.22;
      } else if (f.weapon && f.weapon.uses <= 0) {
        floatText(f.x, f.y - 46, RR.t(RR.WEAPONS[f.weapon.id].kind === 'ranged' ? 'fx.empty' : 'fx.broken'), 'info');
        f.weapon = null;
        f.useFists = false;
        sfx('broken');
      }
      return;
    }
    // forward step during a swing, unless already toe-to-toe
    if (lunge > 0) {
      const tgt = nearestEnemy(f, W.range * 0.6 + f.r, false);
      if (tgt) lunge = 0;
    }
    f.vx = Math.cos(f.face) * lunge;
    f.vy = Math.sin(f.face) * lunge;
  }

  function applyHit(att, tgt, dmg, knock, ang, kind, heavy, W) {
    if (!alive(tgt) || tgt.spawnT > 0) return 'none';
    const isP = tgt.team === 'player';
    if (tgt.iframes > 0) {
      if (!tgt.dodgeShown) { floatText(tgt.x, tgt.y - 44, RR.t('fx.dodge'), 'info'); tgt.dodgeShown = true; }
      return 'dodged';
    }
    if (att.team === 'enemy') dmg *= M.diff.enemyDmg;
    let res = 'hit';
    if (tgt.blocking) {
      const src = kind === 'melee' ? Math.atan2(att.y - tgt.y, att.x - tgt.x) : ang + Math.PI;
      if (Math.abs(angDiff(src, tgt.face)) < 1.3) res = isP && M.t - tgt.blockStart <= 0.2 ? 'parry' : 'block';
    }
    const hx = tgt.x - Math.cos(ang) * tgt.r * 0.7, hy = tgt.y - Math.sin(ang) * tgt.r * 0.7;
    if (res === 'parry') {
      M.stats.parries++;
      sfx('parry');
      floatText(tgt.x, tgt.y - 48, RR.t('fx.parry'), 'good');
      particles(hx, hy, 12, 260, 'spark', 0.35, 3);
      tgt.st = Math.min(tgt.maxSt, tgt.st + 14);
      M.hitstop = 0.1;
      if (kind === 'melee' && alive(att)) {
        stagger(att, 0.9);
        att.kx -= Math.cos(ang) * 220;
        att.ky -= Math.sin(ang) * 220;
      }
      if (rng() < 0.4) bark('kade', pick(RR.BARKS.parry));
      return 'parry';
    }
    if (res === 'block') {
      dmg *= kind === 'melee' ? 0.15 : 0.3;
      knock *= 0.35;
      sfx('block');
      particles(hx, hy, 6, 180, 'spark', 0.25, 3);
      if (isP) {
        M.stats.blocks++;
        spendSt(tgt, kind === 'melee' ? (heavy ? 20 : 13) : 9);
        floatText(tgt.x, tgt.y - 44, RR.t('fx.block'), 'info');
        if (tgt.st <= 0) {
          tgt.guardLock = true;
          stagger(tgt, 0.7);
          sfx('guardbreak');
          floatText(tgt.x, tgt.y - 60, RR.t('fx.break'), 'bad');
        }
      } else if (heavy) {
        stagger(tgt, 0.55);
        sfx('guardbreak');
        floatText(tgt.x, tgt.y - 60, RR.t('fx.break'), 'good');
      }
    } else {
      if (kind === 'ranged') sfx('arrowhit');
      else if (W && W.icon === 'sword') sfx('slash');
      else sfx(heavy ? 'heavy' : 'punch');
      particles(hx, hy, heavy ? 10 : 6, heavy ? 280 : 200, isP ? 'hurt' : 'hit', 0.3, heavy ? 4 : 3);
      if (isP) { stagger(tgt, 0.16); sfx('hurt'); }
      else {
        // Opponents can be interrupted, but not stun-locked: after a finisher or three
        // quick hits they brace (no flinch for a moment) and answer back sooner.
        if (tgt.armorT <= 0 && (!tgt.def.poise || heavy || kind === 'ranged')) stagger(tgt, heavy ? 0.38 : 0.16);
        tgt.streak = M.t - tgt.lastHitT < 1.0 ? tgt.streak + 1 : 1;
        tgt.lastHitT = M.t;
        if (heavy || tgt.streak >= 3) { tgt.armorT = 1.25; tgt.streak = 0; tgt.cool = Math.min(tgt.cool, 0.2); }
      }
    }
    dmg = Math.max(1, Math.round(dmg));
    tgt.hp -= dmg;
    tgt.flash = 0.12;
    tgt.kx += Math.cos(ang) * knock;
    tgt.ky += Math.sin(ang) * knock;
    floatText(tgt.x, tgt.y - 34, String(dmg), isP ? 'bad' : res === 'block' ? 'info' : 'dmg');
    if (isP) {
      M.stats.taken += dmg;
      M.shake = Math.max(M.shake, res === 'block' ? 4 : 10);
      if (res !== 'block') RR.vibrate(35);
    } else {
      M.stats.dealt += dmg;
      M.shake = Math.max(M.shake, heavy ? 8 : 4);
    }
    M.hitstop = Math.max(M.hitstop, heavy ? 0.085 : 0.045);
    if (tgt.hp <= 0) kill(tgt, ang);
    else if (isP && tgt.hp < tgt.maxHp * 0.3 && !M.lowBarked) { M.lowBarked = true; bark('kade', pick(RR.BARKS.low)); }
    return res;
  }

  function kill(f, ang) {
    f.hp = 0;
    f.state = 'dead';
    f.deadT = 1.3;
    f.atk = null;
    f.blocking = false;
    f.kx += Math.cos(ang) * 200;
    f.ky += Math.sin(ang) * 200;
    sfx('ko');
    particles(f.x, f.y, 18, 300, f.team === 'player' ? 'hurt' : 'hit', 0.5, 4);
    M.shake = Math.max(M.shake, 14);
    M.hitstop = 0.14;
    if (f.team === 'enemy') {
      M.defeated++;
      M.lastDeathT = M.t;
      if (M.defeated >= M.lineup.length) finish('win');
      else if (rng() < M.diff.orb) M.pickups.push({ kind: 'health', amount: 15, x: f.x, y: f.y, t: 0 });
    } else finish('lose');
  }

  function bark(speaker, lineKey) {
    emit('bark', { speaker, lineKey });
  }

  function finish(result) {
    if (M.result) return;
    M.result = result;
    M.phase = 'ending';
    M.endT = 1.5;
    M.timeScale = 0.3;
    emit('ending', { result });
    if (result === 'win') bark('kade', pick(RR.BARKS.win)); else bark('ann', pick(RR.BARKS.lose));
  }

  /* ---- player ---------------------------------------------------------- */
  const NOINPUT = { mx: 0, my: 0, attackPressed: false, block: false, dodgePressed: false, swapPressed: false };

  function threatFor(p) {
    let best = null, bd = 720;
    for (const f of M.fighters) {
      if (f.team === p.team || !alive(f) || !f.atk || f.atk.phase === 'r') continue;
      const d = hyp(f.x - p.x, f.y - p.y);
      if (d < bd) { bd = d; best = f; }
    }
    return best || nearestEnemy(p, 280, false);
  }
  function autoAim(p) {
    const W = wepOf(p);
    let t;
    if (W.kind === 'melee') t = nearestEnemy(p, W.range + 130, false);
    else {
      const vis = M.condDef.vision ? M.condDef.vision + 90 : 980;
      t = nearestEnemy(p, vis, true) || nearestEnemy(p, vis, false);
    }
    return t ? Math.atan2(t.y - p.y, t.x - p.x) : p.face;
  }
  function tryDodge(p, mx, my, len) {
    if (M.t < p.dodgeReady || p.st < 20) return false;
    spendSt(p, 24);
    p.dodgeA = len > 0.2 ? Math.atan2(my, mx) : p.face + Math.PI;
    p.state = 'dodge';
    p.stT = 0.26;
    p.iframes = 0.25;
    p.dodgeShown = false;
    p.dodgeReady = M.t + 0.55;
    p.atk = null;
    p.blocking = false;
    M.stats.dodges++;
    sfx('dodge');
    particles(p.x, p.y, 6, 90, 'dust', 0.4, 5);
    return true;
  }
  function nearWeaponPickup(p, d) {
    let best = null, bd = d;
    for (const k of M.pickups) {
      if (k.kind !== 'weapon') continue;
      const dd = hyp(k.x - p.x, k.y - p.y);
      if (dd < bd) { bd = dd; best = k; }
    }
    return best;
  }
  function takeWeapon(p, k) {
    if (p.weapon) M.pickups.push({ kind: 'weapon', id: p.weapon.id, uses: p.weapon.uses, x: p.x, y: p.y + 6, t: 0, cool: 0.6 });
    p.weapon = { id: k.id, uses: k.uses };
    p.useFists = false;
    M.pickups.splice(M.pickups.indexOf(k), 1);
    M.stats.pickups++;
    sfx('pickup');
    floatText(p.x, p.y - 48, RR.t('weapon.' + k.id), 'good');
  }

  function updatePlayer(dt, inp) {
    const p = M.player;
    p.flash = Math.max(0, p.flash - dt);
    if (!alive(p)) { p.deadT -= dt; moveBody(p, dt, 0, 0, 12); return; }
    p.comboT -= dt;
    p.iframes = Math.max(0, p.iframes - dt);
    if (M.t - p.lastSt > 0.65) p.st = Math.min(p.maxSt, p.st + (p.blocking ? 9 : 27) * dt);
    if (inp.attackPressed) p.buf = 0.22; else p.buf = Math.max(0, p.buf - dt);
    let mx = inp.mx, my = inp.my, len = hyp(mx, my);
    if (len > 1) { mx /= len; my /= len; len = 1; }
    let tvx = 0, tvy = 0, acc = M.condDef.slick ? 5.5 : 16;

    if (p.state === 'stagger') {
      p.stT -= dt;
      if (p.stT <= 0) p.state = 'idle';
    } else if (p.state === 'dodge') {
      p.stT -= dt;
      const sp = 640 * (M.condDef.slick ? 1.12 : 1);
      tvx = Math.cos(p.dodgeA) * sp;
      tvy = Math.sin(p.dodgeA) * sp;
      acc = 40;
      if (p.stT <= 0) p.state = 'idle';
    } else if (p.state === 'attack') {
      updateAttack(p, dt, null);
      tvx = p.vx; tvy = p.vy; acc = 40;
      if (p.atk && p.atk.phase === 'r') {
        if (inp.dodgePressed) tryDodge(p, mx, my, len);
        else if (p.buf > 0 && p.atk.t > p.atk.rd * 0.55 && p.atk.idx < p.atk.W.moves.length - 1 && p.st >= p.atk.W.st * 0.5) {
          // combo: chain the next move without waiting out the full recovery
          p.atk = null; p.state = 'idle';
          if (startAttack(p, autoAim(p))) p.buf = 0;
        }
      }
    } else {
      const wantBlock = inp.block && p.st > 1 && !p.guardLock;
      if (!inp.block) p.guardLock = false;
      if (wantBlock && !p.blocking) p.blockStart = M.t;
      p.blocking = wantBlock;
      const sp = p.def.speed * (p.blocking ? 0.45 : 1);
      tvx = mx * sp; tvy = my * sp;
      if (p.blocking) {
        const th = threatFor(p);
        if (th) p.face = turnToward(p.face, Math.atan2(th.y - p.y, th.x - p.x), 16 * dt);
        else if (len > 0.15) p.face = turnToward(p.face, Math.atan2(my, mx), 12 * dt);
      } else if (len > 0.15) p.face = turnToward(p.face, Math.atan2(my, mx), 14 * dt);
      if (inp.dodgePressed) tryDodge(p, mx, my, len);
      else if (p.buf > 0 && !p.blocking) { if (startAttack(p, autoAim(p))) p.buf = 0; }
      if (inp.swapPressed && p.state === 'idle') {
        const k = nearWeaponPickup(p, 50);
        if (k) takeWeapon(p, k);
        else if (p.weapon) { p.useFists = !p.useFists; sfx('ui'); }
      }
    }
    const ox = p.x, oy = p.y;
    moveBody(p, dt, tvx, tvy, acc);
    const moved = hyp(p.x - ox, p.y - oy);
    M.stats.moved += moved;
    p.walk += moved * 0.045;

    // pickups
    M.nearTake = false;
    for (let i = M.pickups.length - 1; i >= 0; i--) {
      const k = M.pickups[i];
      const d = hyp(k.x - p.x, k.y - p.y);
      if (k.kind === 'weapon') {
        if (k.cool > 0) { k.cool -= dt; continue; }
        if (!p.weapon && d < 36 && p.state !== 'dodge') takeWeapon(p, k);
        else if (p.weapon && d < 50) M.nearTake = true;
      } else if (d < 38 && p.hp < p.maxHp) {
        const before = p.hp;
        p.hp = Math.min(p.maxHp, p.hp + k.amount);
        floatText(p.x, p.y - 46, '+' + Math.round(p.hp - before), 'good');
        sfx('heal');
        particles(p.x, p.y, 10, 120, 'heal', 0.5, 3);
        M.pickups.splice(i, 1);
      }
    }
  }

  function moveBody(f, dt, tvx, tvy, acc) {
    const k = Math.min(1, acc * dt);
    f.vx += (tvx - f.vx) * k;
    f.vy += (tvy - f.vy) * k;

  }

  /* ---- toasts, banners, subtitles --------------------------------------- */
  function toast(text) { const t = $('toast'); t.textContent = text; t.hidden = false; toastT = 1.8; }
  function banner(text, sub, big) {
    const b = $('banner');
    $('banner-main').textContent = text;
    $('banner-sub').textContent = sub || '';
    b.classList.toggle('big', !!big);
    b.hidden = true; void b.offsetWidth; b.hidden = false;
    $('hud').classList.add('has-banner');
    bannerT = big ? 1.1 : 2.0;
  }
  function subtitle(speaker, lineKey) {
    const who = speaker === 'ann' ? RR.t('speaker.ann') : RR.t('fighter.' + speaker + '.name');
    const line = RR.t(lineKey);
    if (RR.settings.subs) {
      $('sub-who').textContent = who;
      $('sub-line').textContent = line;
      $('subtitle').hidden = false;
      subT = 2.6;
    }
    RR.audio.speak(line);
  }

  /* ---- first-match hints ------------------------------------------------ */
  const HINTS = [
    { key: 'move', done: (M) => M.stats.moved > 150, max: 30 },
    { key: 'attack', done: (M) => M.stats.attacks >= 3, max: 20 },
    { key: 'block', wait: (M) => M.spawned > 0, done: (M) => M.stats.blocks + M.stats.parries >= 1, max: 11 },
    { key: 'dodge', done: (M) => M.stats.dodges >= 1, max: 9 },
    { key: 'weapon', done: (M) => M.stats.pickups >= 1, max: 11 },
  ];
  function updateHints(M, dt) {
    if (!hint) return;
    const box = $('hint');
    if (hint.i >= HINTS.length) {
      hint.t -= dt;
      if (hint.t <= 0) { box.hidden = true; hint = null; }
      return;
    }
    const h = HINTS[hint.i];
    if (h.wait && !h.wait(M)) { box.hidden = true; return; }
    const text = RR.t('hint.' + h.key + (RR.input.touchMode ? '.touch' : '.keys'));
    if (box.hidden || box.textContent !== text) { box.textContent = text; box.hidden = false; }
    hint.t += dt;
    if (h.done(M) || hint.t > h.max) {
      hint.i++; hint.t = 0;
      if (hint.i >= HINTS.length) {
        box.textContent = RR.t('hint.done');
        hint.t = 2.6;
        RR.setSetting('hints', false);
      }
    }
  }

  /* ---- match HUD --------------------------------------------------------- */
  function condChips(M, parent, rich) {
    parent.textContent = '';
    const add = (name, desc) => {
      const c = el('span', 'chip');
      if (rich) { c.appendChild(el('b', '', name)); if (desc) c.appendChild(document.createTextNode(' · ' + desc)); } else c.textContent = name;
      parent.appendChild(c);
    };
    add(RR.t('cond.' + M.cond), rich ? RR.t('cond.' + M.cond + '.desc') : '');
    if (M.supply) add(RR.t('cond.supply'), rich ? RR.t('cond.supply.desc') : '');
    if (rich) add(RR.t('intro.weapons'), M.weaponSet.map((w) => RR.t('weapon.' + w)).join(', '));
    add(RR.t('diff.' + M.diffId), '');
  }

  function matchStart(M) {
    hideScreens();
    $('hud').hidden = false;
    $('hint').hidden = true; $('banner').hidden = true; $('subtitle').hidden = true;
    $('hud').classList.remove('has-banner'); bannerT = 0; subT = 0;
    $('hud').classList.remove('ended');
    $('touch').hidden = false; $('btn-pause').hidden = false;
    $('hud-name').textContent = RR.t('fighter.' + M.player.id + '.name');
    $('obj-conds').textContent = [RR.t('cond.' + M.cond)].concat(M.supply ? [RR.t('cond.supply')] : []).join(' · ');
    $('card-hero').textContent = RR.t('fighter.' + M.player.id + '.name');
    const foes = $('card-foes');
    foes.textContent = '';
    M.lineup.forEach((id) => foes.appendChild(el('div', '', RR.t('fighter.' + id + '.name'))));
    condChips(M, $('card-chips'), true);
    $('card').hidden = false;
    for (const k in hud) delete hud[k];
    hint = M.hints ? { i: 0, t: 0 } : null;
    RR.audio.music('fight');
    RR.audio.rain(M.cond === 'rain');
  }

  function set(id, prop, val) {
    const key = id + prop;
    if (hud[key] === val) return;
    hud[key] = val;
    const e = $(id);
    if (prop === 'text') e.textContent = val;
    else if (prop === 'hidden') e.hidden = val;
    else if (prop === 'scale') e.style.transform = 'scaleX(' + val + ')';
    else if (prop === 'now') e.setAttribute('aria-valuenow', val);
    else e.classList.toggle(prop, val);
  }

  function frame(dt) {
    const M = RR.game.M;
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
    if (!M) return;
    // drain simulation events
    const ev = RR.game.events;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      if (e.type === 'banner') banner(RR.t(e.key, e.vars), e.sub, e.big);
      else if (e.type === 'bark') subtitle(e.speaker, e.lineKey);
      else if (e.type === 'ending') { $('touch').hidden = true; $('btn-pause').hidden = true; $('hint').hidden = true; if (hint && hint.i >= 2) RR.setSetting('hints', false); hint = null; RR.input.reset(); RR.audio.music('off'); RR.audio.rain(false); RR.audio.sfx(e.result === 'win' ? 'win' : 'lose'); }
      else if (e.type === 'over') showResults(M);
    }
    ev.length = 0;
    if (M.phase !== 'intro' && !$('card').hidden) $('card').hidden = true;
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) { $('banner').hidden = true; $('hud').classList.remove('has-banner'); } }
    if (subT > 0) { subT -= dt; if (subT <= 0) $('subtitle').hidden = true; }
    const p = M.player, hp = Math.max(0, Math.ceil(p.hp));
    set('hp-fill', 'scale', (Math.max(0, p.hp) / p.maxHp).toFixed(3));
    set('hp-num', 'text', String(hp));
    set('hp-track', 'now', String(hp));
    const low = p.hp > 0 && p.hp < p.maxHp * 0.3;
    set('hp-low', 'hidden', !low);
    if (hud.lowCls !== low) { hud.lowCls = low; $('hp-fill').parentElement.parentElement.classList.toggle('low', low); }
    set('st-fill', 'scale', (p.st / p.maxSt).toFixed(2));
    set('st-track', 'now', String(Math.round(p.st)));
    set('obj-count', 'text', M.defeated + '/' + M.lineup.length);
    const sec = Math.floor(M.t);
    set('obj-time', 'text', Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));
    const wid = p.weapon && !p.useFists ? p.weapon.id : 'fists';
    if (hud.wid !== wid) {
      hud.wid = wid;
      $('w-name').textContent = RR.t('weapon.' + wid);
      const c = $('w-icon').getContext('2d');
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 44, 44); c.translate(22, 22); c.strokeStyle = '#f4ecd8';
      RR.weaponIcon(c, RR.WEAPONS[wid].icon, 1.25);
    }
    set('w-uses', 'text', wid === 'fists' ? (p.weapon ? '(' + RR.t('weapon.' + p.weapon.id) + ' ' + p.weapon.uses + ')' : '') : '× ' + p.weapon.uses);
    set('swap-label', 'text', RR.t(M.nearTake ? 'btn.take' : 'btn.swap'));
    set('btn-swap', 'take', !!M.nearTake);
    set('btn-swap', 'off', !M.nearTake && !p.weapon);
    if (M.phase === 'fight') updateHints(M, dt);
    if (RR.settings.showFps) {
      fpsAcc += dt; fpsN++;
      if (fpsAcc >= 0.5) { $('fps').textContent = RR.t('hud.fps', { n: Math.round(fpsN / fpsAcc) }); fpsAcc = 0; fpsN = 0; }
    }
  }

  /* ---- results ---------------------------------------------------------- */
  function showResults(M) {
    const win = M.result === 'win', s = M.stats, root = $('s-results');
    root.classList.toggle('win', win); root.classList.toggle('lose', !win);
    $('res-title').textContent = RR.t(win ? 'res.victory' : 'res.defeat');
    const stars = $('res-stars');
    stars.textContent = '';
    stars.setAttribute('aria-label', RR.t('res.stars', { n: M.stars }));
    for (let i = 0; i < 3; i++) stars.appendChild(el('i', i < M.stars ? 'on' : ''));
    $('res-score').textContent = String(M.score);
    const isBest = M.score > RR.save.best;
    if (isBest) RR.save.best = M.score;
    RR.save.plays++;
    RR.persist();
    $('res-best').textContent = isBest ? RR.t('res.newbest') : RR.t('res.best', { n: RR.save.best });
    condChips(M, $('res-conds'), false);
    const dl = $('res-stats');
    dl.textContent = '';
    const sec = Math.floor(M.t);
    [
      ['res.time', Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0')],
      ['res.defeated', M.defeated + '/' + M.lineup.length],
      ['res.dealt', Math.round(s.dealt)],
      ['res.taken', Math.round(s.taken)],
      ['res.accuracy', s.attacks ? Math.round((s.hits / s.attacks) * 100) + '%' : '0%'],
      ['res.blocks', s.blocks],
      ['res.parries', s.parries],
    ].forEach(([k, v]) => { dl.appendChild(el('dt', '', RR.t(k))); dl.appendChild(el('dd', '', String(v))); });
    $('hud').hidden = true;
    stack.length = 0;
    show('results');
    RR.app.onMatchOver();
  }

  RR.ui = {
    init() {
      RR.applyI18n();
      buildStatic();
      applySettings('*');
      RR.onSetting(applySettings);
      document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.getAttribute('data-go'))));
      document.querySelectorAll('[data-back]').forEach((b) => b.addEventListener('click', () => RR.ui.back()));
      $('a-fight').addEventListener('click', () => RR.app.startMatch());
      $('btn-pause').addEventListener('click', () => RR.app.pause());
      $('p-resume').addEventListener('click', () => RR.app.resume());
      $('p-restart').addEventListener('click', () => RR.app.startMatch());
      $('p-settings').addEventListener('click', () => go('settings'));
      $('p-quit').addEventListener('click', () => RR.app.quit());
      $('r-rematch').addEventListener('click', () => RR.app.startMatch());
      $('r-setup').addEventListener('click', () => { stack.length = 0; stack.push('menu'); RR.audio.sfx('ui'); show('arena'); });
      $('r-menu').addEventListener('click', () => RR.app.quit());
      // any first interaction unlocks audio
      const unlock = () => { if (RR.audio.init()) { if (!RR.app.inMatch) RR.audio.music('menu'); } };
      window.addEventListener('pointerdown', unlock);
      window.addEventListener('keydown', unlock);
      show('menu');
    },
    show, go, hideScreens, matchStart, frame, toast,
    back() {
      if (current === 'pause') { RR.app.resume(); return; }
      back();
    },
    get current() { return current; },
    clearStack() { stack.length = 0; },
  };
})();

/* ---- main.js ---- */
/* Rift Rumble — boot, app state, main loop. */
(function () {
  const RR = (window.RR = window.RR || {});
  const $ = (id) => document.getElementById(id);
  RR.fontDisplay = '"Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif';
  RR.version = '0.1.0';

  RR.app = {
    inMatch: false,
    paused: false,
    startMatch(opts) {
      RR.audio.init();
      RR.audio.resume();
      RR.input.reset();
      const s = RR.settings;
      RR.game.newMatch(Object.assign({ arena: 'sundial', fighter: 'kade', cond: s.cond, supply: s.supply, diff: s.diff, hints: s.hints }, opts || {}));
      this.inMatch = true;
      this.paused = false;
      $('rr').classList.remove('paused');
      RR.ui.clearStack();
      RR.ui.matchStart(RR.game.M);
    },
    pause() {
      const M = RR.game.M;
      if (!this.inMatch || this.paused || !M || M.phase === 'ending' || M.phase === 'over') return;
      this.paused = true;
      $('rr').classList.add('paused');
      RR.input.reset();
      RR.ui.clearStack();
      RR.ui.show('pause');
      RR.audio.music('off');
      RR.audio.hush();
    },
    resume() {
      if (!this.paused) return;
      this.paused = false;
      $('rr').classList.remove('paused');
      RR.ui.clearStack();
      RR.ui.hideScreens();
      RR.audio.music('fight');
    },
    quit() {
      this.inMatch = false;
      this.paused = false;
      $('rr').classList.remove('paused');
      RR.game.clear();
      $('hud').hidden = true;
      $('card').hidden = true;
      RR.audio.rain(false);
      RR.audio.hush();
      RR.audio.music('menu');
      RR.ui.clearStack();
      RR.ui.show('menu');
    },
    onMatchOver() { this.inMatch = false; },
  };

  // Back / Escape: returns false only when there is nothing left to go back to.
  RR.onBack = function () {
    const a = RR.app, cur = RR.ui.current;
    if (a.inMatch && !a.paused) { a.pause(); return true; }
    if (a.paused) { RR.ui.back(); return true; }
    if (cur === 'results') { a.quit(); return true; }
    if (cur && cur !== 'menu') { RR.ui.back(); return true; }
    return false;
  };
  // Called by the Android wrapper (and by tab visibility) when the app goes to the background.
  RR.onHostPause = function () { RR.app.pause(); RR.audio.hush(); RR.audio.suspend(); };
  RR.onHostResume = function () { RR.audio.resume(); };

  let last = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) { last = ts; return; }
    let dt = (ts - last) / 1000;
    if (RR.settings.fps30 && dt < 0.03) return;
    last = ts;
    dt = Math.min(dt, 0.05);
    if (RR.input.takePause()) RR.onBack();
    const a = RR.app;
    const live = a.inMatch && !a.paused;
    if (live) {
      RR.game.update(dt, RR.input.state());
      RR.input.endFrame();
    }
    RR.ui.frame(a.paused ? 0 : dt);
    RR.render.frame(a.paused ? 0 : dt);
  }

  function boot() {
    RR.render.init($('cv'));
    RR.input.init();
    RR.ui.init();
    document.addEventListener('visibilitychange', () => { if (document.hidden) RR.onHostPause(); else RR.onHostResume(); });
    // keep the page from scrolling or zooming under the game
    $('rr').addEventListener('touchmove', (e) => { if (!e.target.closest('.body')) e.preventDefault(); }, { passive: false });
    $('rr').addEventListener('contextmenu', (e) => e.preventDefault());
    // redraw canvas-drawn UI once the display font is ready
    if (document.fonts && document.fonts.load) {
      document.fonts.load('900 20px "Big Shoulders Display"').catch(() => {});
    }
    requestAnimationFrame(loop);
  }

  // Published-page hot reload hook (absent everywhere else).
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot();
})();

</script>
</body>
